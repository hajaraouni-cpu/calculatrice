<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Calculatrice de Hajar</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
            background: #ffe6f0;
        }

        .calc {
            width: 260px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 0 15px #ff66b2;
        }

        .title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ff2e93;
            margin-bottom: 10px;
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 22px;
            text-align: right;
            margin-bottom: 10px;
            border: 2px solid #ff99cc;
            border-radius: 8px;
        }

        /* grid buttons */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        button {
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #ffb3d9;
        }

        button:hover {
            background: #ff66b2;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calc">

        <div class="title">🌸 Calculatrice de Hajar 🌸</div>

        <input type="text" id="display" readonly>

        <div class="buttons">

            <!-- 123 -->
            <button onclick="add('1')">1</button>
            <button onclick="add('2')">2</button>
            <button onclick="add('3')">3</button>
            <button onclick="add('+')">+</button>

            <!-- 456 -->
            <button onclick="add('4')">4</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('6')">6</button>
            <button onclick="add('-')">-</button>

            <!-- 789 -->
            <button onclick="add('7')">7</button>
            <button onclick="add('8')">8</button>
            <button onclick="add('9')">9</button>
            <button onclick="add('*')">*</button>

            <!-- 0 C = / -->
            <button onclick="add('0')">0</button>
            <button onclick="clearAll()">C</button>
            <button onclick="result()">=</button>
            <button onclick="add('/')">/</button>

        </div>

    </div>

    <script>
        let display = document.getElementById("display");

        function add(v) {
            display.value += v;
        }

        function result() {
            try {
                display.value = eval(display.value);
            } catch {
                display.value = "Error";
            }
        }

        function clearAll() {
            display.value = "";
        }
    </script>

</body>

</html>
